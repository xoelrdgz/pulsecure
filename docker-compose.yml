services:
  pulsecure:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsecure
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./app-data:/app/data
    environment:
      - RUST_LOG=info
      - PULSECURE_WEB_ADDR=0.0.0.0:8080
      - PULSECURE_DB_PATH=/app/data/pulsecure.db
      - PULSECURE_KEY_PASSWORD_FILE=/run/secrets/pulsecure_key_password
      - PULSECURE_FHE_CONCURRENCY=1
    secrets:
      - pulsecure_key_password
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"

secrets:
  pulsecure_key_password:
    file: ./secrets/pulsecure_key_password
